# Throwaway: backend regression with real Postgres (pgvector), Redis and MinIO.
name: backend-regression
on:
  push:
    branches: [ci-regression]
jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: clardentity
          POSTGRES_PASSWORD: clardentity_dev_pw
          POSTGRES_DB: clardentity
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U clardentity" --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    env:
      DATABASE_URL: postgresql+asyncpg://clardentity:clardentity_dev_pw@localhost:5432/clardentity
      REDIS_URL: redis://localhost:6379/0
      S3_ENDPOINT: http://localhost:19000
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      S3_BUCKET: clardentity-dev
      S3_REGION: us-east-1
      OPENAI_API_KEY: test-placeholder
      JWT_SECRET: ci-only-test-secret-not-used-anywhere
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: MinIO
        working-directory: .
        run: |
          docker run -d --name minio -p 19000:9000 -e MINIO_ROOT_USER=minioadmin -e MINIO_ROOT_PASSWORD=minioadmin minio/minio server /data
          for i in $(seq 1 30); do curl -sf http://localhost:19000/minio/health/live && break; sleep 2; done
      - run: pip install -q -r requirements.txt
      - name: Bucket
        run: python -c "import boto3; boto3.client('s3', endpoint_url="http://localhost:19000", aws_access_key_id='minioadmin', aws_secret_access_key='minioadmin', region_name='us-east-1').create_bucket(Bucket='clardentity-dev')"
      - name: Migrate
        run: alembic upgrade head
      - name: Pytest
        run: |
          set -o pipefail
          python -m pytest -q -rfEs --tb=short -p no:cacheprovider 2>&1 | tee pytest.txt
      - name: Summary
        if: always()
        run: |
          {
            echo '## Backend pytest'
            echo '```'
            tail -n 60 pytest.txt 2>/dev/null || echo "pytest did not run"
            echo '```'
            echo '### Failures'
            echo '```'
            grep -E "^(FAILED|ERROR)" pytest.txt | head -80 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
